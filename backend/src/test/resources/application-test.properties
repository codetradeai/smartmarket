# ============================================
# SmartMarket - Perfil TESTES
# (src/test/resources — nao empacotado no JAR de producao)
# ============================================

# Banco H2 em memoria (nao precisa de Docker)
spring.datasource.url=jdbc:h2:mem:smartmarket_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# data.sql e PostgreSQL. Cada teste H2 monta o proprio cenario.
spring.sql.init.mode=never

# JWT: segredo falso exclusivo para testes automatizados.
# Nao usar em nenhum ambiente real.
jwt.secret=test-secret-somente-para-testes-nao-usar-em-producao-xx
jwt.expiration=3600000

# Rate Limiting desativado em testes automatizados
security.rate-limit.enabled=false
