# ============================================
# SmartMarket - Perfil PRODUCAO
# ============================================

# Banco de Dados PostgreSQL (configuravel via ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/smartmarket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartmarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartmarket123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & DDL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

# Performance & Logging
spring.jpa.show-sql=false
server.port=8080

# CORS em producao
cors.allowed-origins=${SMARTMARKET_CORS_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost:5173}
