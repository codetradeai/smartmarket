<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sm-gradient-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38B6FF" />
    </linearGradient>
    <linearGradient id="sm-text-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>
  </defs>

  <!-- ================= ÍCONE NEON GLOW ================= -->
  <g id="smart-icon" transform="translate(10, 10)">
    <path d="M 5 15 L 20 15 L 32 55 L 75 55 L 85 24 L 28 24" 
          stroke="url(#sm-gradient-dark)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <path d="M 28 55 L 34 63 L 73 63" 
