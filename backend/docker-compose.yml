services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmarket-db
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: smartmarket
      POSTGRES_PASSWORD: smartmarket123
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
