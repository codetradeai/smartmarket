<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartMarket · Mapa técnico</title>
<style>
:root{
  --bg:#14171c; --surface:#1b1f26; --surface2:#222730; --line:#2c333d; --line2:#3a434f;
  --text:#e6e9ee; --mut:#8c97a6; --acc:#2dd4bf; --acc-bg:rgba(45,212,191,.10); --acc-line:rgba(45,212,191,.45);
  --warn:#f5b041; --warn-bg:rgba(245,176,65,.10); --bad:#f87171; --bad-bg:rgba(248,113,113,.10);
  --r:14px; --t:.2s;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}

/* cabeçalho */
header{position:sticky;top:0;z-index:20;background:rgba(20,23,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.brand small{color:var(--mut);font-weight:400}
nav[role=tablist]{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:10px;color:var(--mut);transition:color var(--t),background var(--t);font-size:.92rem;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--surface)}
.tab[aria-selected=true]{color:var(--acc);background:var(--acc-bg)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line2);border-radius:10px;color:var(--text);transition:border-color var(--t),background var(--t),color var(--t);font-size:.9rem}
.btn:hover{border-color:var(--acc-line);background:var(--surface)}
.btn.primary{background:var(--acc);color:#0b1412;border-color:var(--acc);font-weight:600}
.btn.primary:hover{background:#5eead4}
.btn[disabled]{opacity:.4;cursor:default}

main{max-width:1280px;margin:0 auto;padding:36px 24px 72px}
.panel{display:none;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:1.6rem;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 14px;font-weight:600}
.lead{color:var(--mut);margin:0 0 28px;max-width:70ch}
.eyebrow{color:var(--acc);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:8px}

/* planta */
.search{position:relative;max-width:420px;margin-bottom:28px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{width:100%;padding:11px 14px 11px 40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;transition:border-color var(--t)}
.search input:focus{outline:none;border-color:var(--acc-line)}
.hits{display:flex;flex-wrap:wrap;gap:8px;margin:-14px 0 24px;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);font-size:.8rem;color:var(--text);transition:border-color var(--t),background var(--t)}
button.chip:hover{border-color:var(--acc-line);background:var(--acc-bg)}
.chip .k{color:var(--mut)}

.flow{display:flex;align-items:stretch;gap:0}
.node{flex:1;min-width:0;text-align:left;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color var(--t),background var(--t),opacity var(--t),transform var(--t),box-shadow var(--t);position:relative;display:flex;flex-direction:column;gap:6px}
button.node:hover{border-color:var(--line2);transform:translateY(-2px)}
.node .ico{width:40px;height:40px;border-radius:11px;background:var(--surface2);color:var(--acc);display:grid;place-items:center;margin-bottom:6px}
.node .ico .ic{width:22px;height:22px}
.node b{font-size:1.05rem;font-weight:600}
.node span.sub{color:var(--mut);font-size:.84rem}
.node .count{position:absolute;top:14px;right:14px;font-size:.72rem;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.node.sel{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-bg),var(--surface));box-shadow:0 0 0 3px var(--acc-bg)}
.node.dim{opacity:.35}
.node.match{border-color:var(--acc-line)}
.node.active{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-bg),var(--surface));box-shadow:0 0 0 3px var(--acc-bg)}
.node.idle{opacity:.45}
.edge{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--line2)}
.edge svg{width:60px;height:24px;overflow:visible;transition:color var(--t)}
.edge .l{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge em{font-style:normal;font-size:.68rem;color:var(--mut);text-align:center;line-height:1.2}
.edge.on{color:var(--acc)}
.edge.on .l.line{stroke-dasharray:5 5;animation:dash .8s linear infinite}
.edge.rev svg{transform:scaleX(-1)}
@keyframes dash{to{stroke-dashoffset:-20}}

.drill{margin-top:28px;display:none}
.drill.on{display:block;animation:fade .2s ease}
.drill-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.drill p.d{color:var(--mut);margin:0 0 18px;max-width:75ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;transition:border-color var(--t),transform var(--t),opacity var(--t);display:flex;flex-direction:column;gap:6px}
button.card:hover{border-color:var(--acc-line);transform:translateY(-2px)}
.card b{font-weight:600}
.card span{color:var(--mut);font-size:.86rem}
.card.hit{border-color:var(--acc-line);background:var(--acc-bg)}
.card.dim{opacity:.3}
.card small{color:var(--mut);font-size:.74rem;margin-top:auto;padding-top:6px}

/* drawer */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity var(--t);z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{position:static;background:none;backdrop-filter:none;border:0;padding:22px 24px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer h3{margin:0;font-size:1.2rem;font-weight:650}
.drawer .tag{color:var(--acc);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.drawer .body{padding:8px 24px 32px;overflow:auto}
.drawer h4{margin:22px 0 8px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.drawer p{margin:0;color:var(--text)}
.drawer ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.drawer li{font-size:.9rem;padding-left:14px;position:relative}
.drawer li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.drawer li.f{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--text);word-break:break-all}
.io{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.io h5{margin:0 0 6px;font-size:.8rem;color:var(--acc);font-weight:600}
.kv{width:100%;border-collapse:collapse;font-size:.84rem}
.kv td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--mut);padding-right:14px;white-space:nowrap}

/* simulador */
.seg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.seg .btn[aria-pressed=true]{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.sim-grid{display:grid;grid-template-columns:1fr;gap:22px}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.legend .n{color:var(--acc);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.legend h3{margin:4px 0 8px;font-size:1.2rem;font-weight:600}
.legend p{margin:0 0 12px;color:var(--text);max-width:80ch}
.legend .nota{color:var(--mut);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.prog{display:flex;gap:6px;margin:0 0 18px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background var(--t)}
.prog i.done{background:var(--acc-line)}
.prog i.cur{background:var(--acc)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* métricas */
.group{margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:4px}
.metric .v{font-size:2.3rem;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.metric .v small{font-size:1rem;font-weight:500;color:var(--mut);margin-left:4px}
.metric .lb{font-weight:550}
.metric .nt{color:var(--mut);font-size:.82rem}
.metric .src{color:var(--mut);font-size:.72rem;margin-top:auto;padding-top:10px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.note{background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:14px 18px;color:var(--mut);font-size:.88rem}

/* roadmap */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.item .top{display:flex;gap:10px;align-items:flex-start}
.item .ok{color:var(--acc);margin-top:2px}
.item b{font-weight:600}
.item .ev{color:var(--mut);font-size:.8rem;margin-top:4px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.item .rec{margin:10px 0 0;font-size:.92rem}
.item .rec span{color:var(--acc);font-weight:600}
.item details{margin-top:10px}
.item summary{cursor:pointer;color:var(--mut);font-size:.82rem}
.item details p{margin:8px 0 0;color:var(--mut);font-size:.86rem}
.prio{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.prio h2{margin:0}
.prio .sw{width:10px;height:10px;border-radius:50%}
.prio.a .sw{background:var(--bad)} .prio.m .sw{background:var(--warn)} .prio.b .sw{background:var(--acc)}
.prio span{color:var(--mut);font-size:.85rem}
.item.a{border-left:3px solid var(--bad)} .item.m{border-left:3px solid var(--warn)} .item.b{border-left:3px solid var(--line2)}
.id{font-size:.72rem;color:var(--mut);border:1px solid var(--line);padding:1px 7px;border-radius:999px;font-family:ui-monospace,Consolas,monospace}
.sec-gap{margin-top:30px}

footer{max-width:1280px;margin:0 auto;padding:0 24px 40px;color:var(--mut);font-size:.8rem}
.hint kbd{border:1px solid var(--line2);border-radius:5px;padding:0 6px;font-size:.75rem;background:var(--surface)}

/* modo apresentação */
body.pres .apoio{display:none!important}
body.pres main{padding-top:48px;max-width:1500px}
body.pres{font-size:18px}
body.pres header{background:transparent;border:0;backdrop-filter:none}

@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:820px){
  .bar{padding:10px 16px;gap:10px}
  nav[role=tablist]{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  main{padding:24px 16px 56px}
  .flow{flex-direction:column}
  .edge{width:auto;height:64px;flex-direction:row;gap:10px}
  .edge svg{transform:rotate(90deg)}
  .edge.rev svg{transform:rotate(90deg) scaleX(-1)}
  .io{grid-template-columns:1fr}
  .node .count{top:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

moto nunca seria usado. Por inferência do código, a etapa de carga falha no runner (não há Postgres lá). Não há como verificar o histórico de execuções do Actions a partir daqui.","recomendacao":"Corrigir para `pip install -r scraper/requirements.txt`; ou rodar um serviço postgres no job, ou mover a coleta para um servidor com o banco (systemd) e deixar o Actions só como teste. Alinhar nomes das variáveis (DSN)."},{"id":"A-07","titulo":"Rate limiting confia em X-Forwarded-For e X-Real-IP enviados pelo cliente","severidade":"média","arquivo_linha":["backend/src/main/java/com/smartmarket/security/RateLimitingFilter.java:84-95"],"evidencia":"O IP usado para o limite vem do primeiro valor de X-Forwarded-For sem verificar se a requisição veio de proxy confiável. Um atacante troca o header a cada tentativa e contorna o limite de 15/min no login. Além disso o mapa de contadores nunca é limpo (cresce com cada IP).","recomendacao":"Usar `server.forward-headers-strategy=native` + RemoteIpFilter do Tomcat com proxies confiáveis (o Nginx) e usar request.getRemoteAddr(); expirar entradas antigas (ex.: Caffeine/Bucket4j)."},{"id":"A-08","titulo":"Portas e compose divergentes (5432 × 5436) com o mesmo container_name","severidade":"baixa","arquivo_linha":["docker-compose.yml:8,14","backend/docker-compose.yml:4,10","backend/src/main/resources/application-dev.properties:6","scraper/rotina_carga.py:142"],"evidencia":"Dois compose definem container `smartmarket-db`; o da raiz expõe 5432 e o do backend, 5436. Dev e scraper apontam para 5436, prod para 5432 (rede interna). Subir os dois ao mesmo tempo gera conflito de nome; o volume `pgdata` também é duplicado.","recomendacao":"Escolher uma porta de host única e documentá-la, ou renomear o container do compose de dev; manter o CLAUDE.md/README alinhados."},{"id":"A-09","titulo":"Swagger/OpenAPI liberado sem autenticação, inclusive no perfil prod","severidade":"baixa","arquivo_linha":["backend/src/main/java/com/smartmarket/security/SecurityConfig.java:75"],"evidencia":"/swagger-ui/** e /v3/api-docs/** são permitAll e não há propriedade springdoc para desligar em prod; expõe o mapa completo da API.","recomendacao":"Definir springdoc.api-docs.enabled=false e springdoc.swagger-ui.enabled=false em application-prod.properties."},{"id":"A-10","titulo":"GET /api/precos/catalogo público devolve todos os produtos com preços, sem paginação nem cache","severidade":"média","arquivo_linha":["backend/src/main/java/com/smartmarket/controller/PrecoController.java:25-28","backend/src/main/java/com/smartmarket/service/PrecoService.java:78-90","backend/src/main/java/com/smartmarket/security/SecurityConfig.java:80"],"evidencia":"O serviço faz produtoRepository.findAll() e carrega todos os preços disponíveis em memória a cada chamada, sem autenticação e fora do rate limit (que só cobre login/registro). Fácil de usar para sobrecarregar o serviço ou para extrair a base inteira.","recomendacao":"Paginar ou consultar com agrupamento no banco, adicionar cache com TTL curto e aplicar rate limit também nos endpoints públicos de leitura."},{"id":"A-11","titulo":"Sem handler genérico de exceção: erros 500 vazam formato padrão do Spring","severidade":"baixa","arquivo_linha":["backend/src/main/java/com/smartmarket/exception/GlobalExceptionHandler.java:18-70"],"evidencia":"Existem 9 handlers específicos, nenhum para Exception. Falhas inesperadas voltam no corpo padrão do Spring (formato diferente de {\"erro\": ...}), o que o frontend não trata de forma uniforme. Também ex.getMessage() é ecoado ao cliente em IllegalArgument e demais (linhas 22,28,34,53).","recomendacao":"Adicionar @ExceptionHandler(Exception.class) com mensagem genérica e log com identificador; revisar quais mensagens internas podem ser expostas."},{"id":"A-12","titulo":"Token JWT em localStorage e interceptor sem tratamento de 403","severidade":"baixa","arquivo_linha":["frontend/src/services/api.js:18,32-52","frontend/src/contexts/AuthContext.jsx:85,124"],"evidencia":"O token fica em localStorage (legível por qualquer XSS). O interceptor trata somente 401; o CLAUDE.md descreve 401/403. Não há uso de dangerouslySetInnerHTML nas fontes (grep sem resultados), o que reduz o risco de XSS.","recomendacao":"Se possível, mover para cookie HttpOnly + SameSite; no mínimo, tratar 403 no interceptor (mensagem/redirecionamento) e manter CSP no Nginx."},{"id":"A-13","titulo":"Cobertura de 70% no frontend citada, mas inexistente","severidade":"média","arquivo_linha":["frontend/package.json:13","frontend/vite.config.js:14-18",".github/workflows/ci.yml:52-54"],"evidencia":"`test:coverage` chama `vitest run --coverage`, mas não há @vitest/coverage-v8/istanbul instalado, nem thresholds. Só 5 arquivos de teste (38 casos) para ~6.400 linhas de páginas; nenhuma página, serviço ou contexto testado. O CI também não roda os testes do scraper nem o lint.","recomendacao":"Instalar @vitest/coverage-v8, configurar `test.coverage.thresholds` e rodar no CI; incluir `npm run lint` e `unittest` do scraper no ci.yml. Se não der tempo, não anunciar a meta de 70% para o frontend."},{"id":"A-14","titulo":"Modelo e DDL fora de sincronia (favorito_produto) e prod com ddl-auto=update","severidade":"média","arquivo_linha":["backend/src/main/java/com/smartmarket/model/FavoritoProduto.java:8","backend/database/smartmarket_ddl_finalizado.sql","backend/src/main/resources/application-prod.properties:12","docker-compose.yml:43"],"evidencia":"A tabela favorito_produto existe só na entidade. O padrão global é `validate`, mas prod e compose usam `update`, que mascara o desvio e altera o schema em produção sem controle. Não há ferramenta de migração (Flyway/Liquibase) no pom.","recomendacao":"Adicionar a tabela ao DDL e adotar Flyway; em prod usar validate."},{"id":"A-15","titulo":"Scripts e agendamento amarrados a um sistema operacional e fuso do servidor","severidade":"baixa","arquivo_linha":["scraper/executar_pipeline.py:4,27","scraper/cron_coleta_diaria.sh:1","scraper/smartmarket-scraper.service:7-8","scraper/agendador_servico.py:93"],"evidencia":"executar_pipeline.py importa fcntl (só Unix) e o .sh/.service são Linux (User=ubuntu, /opt/smartmarket); o desenvolvimento ocorre em Windows (mvnw.cmd). O agendador usa datetime.now() sem fuso, então '04:00 BRT' só vale se o servidor estiver em America/Sao_Paulo.","recomendacao":"Usar zoneinfo('America/Sao_Paulo') no agendador ou definir Environment=TZ=America/Sao_Paulo no service; trocar fcntl por lock multiplataforma (como rotina_carga.py já faz)."},{"id":"A-16","titulo":"Documentação e README com números desatualizados","severidade":"baixa","arquivo_linha":["README.md:7,30","docs/EXPANSAO_RS_SCRAPERS.md:106,110","docs/STATUS-DO-PROJETO-ONDE-PARAMOS.md:13,44","CLAUDE.md:10","scraper/README.md:54-70","backend/src/main/java/com/smartmarket/security/RateLimitingFilter.java:22"],"evidencia":"README, documentos de status e o contrato do scraper citam quantidades e versões anteriores às atuais; o Javadoc do rate limit também diverge do código (15 requisições por minuto).","recomendacao":"Atualizar os números antes da apresentação (ou usar os valores reais deste levantamento) e conferir os slides contra docs/levantamento.json."},{"id":"A-17","titulo":"Docker do frontend em Node 20 enquanto CI usa Node 24; Python 3.11 no CI x 3.14 local","severidade":"baixa","arquivo_linha":["frontend/Dockerfile:6",".github/workflows/ci.yml:41",".github/workflows/coleta_diaria.yml:27"],"evidencia":"Vite 8 / Vitest 5 podem exigir Node mais novo; a imagem compila com Node 20 e o CI testa com 24. O fallback `npm ci || npm install` esconde divergências de lockfile.","recomendacao":"Padronizar a versão de Node (ex.: node:24-alpine) e remover o `|| npm install`. Não testei o build da imagem."}],"pontos_fortes":[{"titulo":"Autorização por camadas e isolamento por usuário","evidencia":"Regras por rota + @EnableMethodSecurity + @PreAuthorize nos controllers admin; ComparadorService valida posse da lista (buscarListaPropr var TABS = ["Planta baixa","Simulador de fluxo","Métricas","Roadmap de evolução"];

/* ---------- abas ---------- */
var cur = 0;
function buildTabs(){
  var nav=$("#tabs");
  nav.innerHTML=TABS.map(function(t,i){return '<button class="tab" role="tab" type="button" id="t'+i+'" aria-controls="p'+i+'" data-i="'+i+'">'+t+'</button>'}).join("");
  nav.addEventListener("click",function(e){var b=e.target.closest(".tab");if(b)setTab(+b.dataset.i)});
}
function setTab(i){
  cur=(i+TABS.length)%TABS.length;
  for(var k=0;k<TABS.length;k++){
    var on=k===cur;
    $("#t"+k).setAttribute("aria-selected",on);$("#t"+k).tabIndex=on?0:-1;
    $("#p"+k).classList.toggle("on",on);
  }
  if(cur!==1)simPause();
  try{history.replaceState(null,"","#"+["planta","simulador","metricas","roadmap"][cur])}catch(e){}
}

function diagramHTML(interativo){
  var h='<div class="flow">';
  BLOCOS.forEach(function(b,i){
    var tag=interativo?"button":"div";
    h+='<'+tag+' class="node" '+(interativo?'type="button" aria-expanded="false" ':'')+'data-b="'+b.id+'">'+
      '<span class="ico">'+ic(b.icone)+'</span><b>'+esc(b.nome)+'</b><span class="sub">'+esc(b.sub)+'</span>'+
      (interativo?'<span class="count">'+b.mods.length+' módulos</span>':'')+'</'+tag+'>';
    if(i<BLOCOS.length-1){
      h+='<div class="edge" data-e="'+i+'"><svg viewBox="0 0 60 24" aria-hidden="true"><path class="l line" d="M2 12H54"/><path class="l" d="M47 5l8 7-8 7"/></svg><em>'+EDGE_LABELS[i]+'</em></div>';
    }
  });
  return h+'</div>';
}

/* ---------- aba 1: planta ---------- */
var selBloco=null, query="";
function buildPlanta(){
  var p=$("#p0");
  p.innerHTML='<div class="eyebrow">Arquitetura</div><h1>Planta baixa do SmartMarket</h1>'+
   '<p class="lead">Quatro blocos ligados por dados: os scrapers alimentam o PostgreSQL, o backend expõe a API e o frontend a consome. Clique em um bloco para ver seus módulos e em um módulo para ver o detalhe.</p>'+
   '<div class="search apoio">'+ic("search")+'<input id="q" type="search" placeholder="Buscar módulo, arquivo ou regra (ex.: JWT, preco, Decimal)" aria-label="Buscar módulos"></div>'+
   '<div class="hits" id="hits"></div>'+
   '<div id="dg">'+diagramHTML(true)+'</div><div class="drill" id="drill"></div>';
  $("#dg").addEventListener("click",function(e){var n=e.target.closest(".node");if(n)selecionar(n.dataset.b)});
  $("#q").addEventListener("input",function(e){query=e.target.value;aplicaBusca()});
  $("#drill").addEventListener("click",function(e){var c=e.target.closest("[data-m]");if(c)abrirDrawer(c.dataset.b,c.dataset.m,c)});
}
function haystack(m){
  return norm([m.nome,m.resumo,m.faz,(m.arquivos||[]).join(" "),(m.entra||[]).join(" "),(m.sai||[]).join(" "),(m.regras||[]).join(" "),(m.extra||[]).map(function(x){return x.k+" "+x.v}).join(" ")].join(" "));
}
function modHit(m,q){return !q||haystack(m).indexOf(q)>=0}
function selecionar(id){
  selBloco=(selBloco===id)?null:id;
  desenhaDrill();aplicaBusca(true);
}
function desenhaDrill(){
  var d=$("#drill");
  document.querySelectorAll("#dg .node").forEach(function(n){var s=n.dataset.b===selBloco;n.classList.toggle("sel",s);n.setAttribute("aria-expanded",s)});
  if(!selBloco){d.classList.remove("on");d.innerHTML="";return}
  var b=BLOCOS.filter(function(x){return x.id===selBloco})[0];
  var q=norm(query.trim());
  d.innerHTML='<div class="drill-head"><h2>'+esc(b.nome)+'</h2><span class="chip"><span class="k">módulos</span> '+b.mods.length+'</span></div><p class="d">'+esc(b.desc)+'</p><div class="cards">'+
   b.mods.map(function(m){
     var hit=q&&modHit(m,q);var dim=q&&!hit;
     return '<button class="card'+(hit?' hit':'')+(dim?' dim':'')+'" type="button" data-b="'+b.id+'" data-m="'+m.id+'"><b>'+esc(m.nome)+'</b><span>'+esc(m.resumo)+'</span><small>'+(m.arquivos||[]).length+' arquivo(s)</small></button>';
   }).join("")+'</div>';
  d.classList.add("on");
}
function aplicaBusca(semDrill){
  var q=norm(query.trim()),hits=[];
  BLOCOS.forEach(function(b){
    var ms=b.mods.filter(function(m){return q&&modHit(m,q)});
    var nm=q&&norm(b.nome+" "+b.sub+" "+b.desc).indexOf(q)>=0;
    var n=$('#dg .node[data-b="'+b.id+'"]');
    n.classList.toggle("match",!!(q&&(ms.length||nm)));
    n.classList.toggle("dim",!!(q&&!ms.length&&!nm));
    ms.forEach(function(m){hits.push({b:b,m:m})});
  });
  var hs=$("#hits");
  hs.innerHTML=q?(hits.length?hits.map(function(h){return '<button class="chip" type="button" data-b="'+h.b.id+'" data-m="'+h.m.id+'"><span class="k">'+esc(h.b.nome)+'</span> '+esc(h.m.nome)+'</button>'}).join(""):'<span class="chip"><span class="k">Nenhum módulo encontrado</span></span>'):"";
  if(!semDrill&&selBloco)desenhaDrill();
}
document.addEventListener("click",function(e){
  var c=e.target.closest("#hits [data-m]");if(c)abrirDrawer(c.dataset.b,c.dataset.m,c);
});

var lastFocus=null;
function lista(a,f){return '<ul>'+a.map(function(x){return '<li'+(f?' class="f"':'')+'>'+esc(x)+'</li>'}).join("")+'</ul>'}
function abrirDrawer(bid,mid,origem){
  var b=BLOCOS.filter(function(x){return x.id===bid})[0];
  var m=b.mods.filter(function(x){return x.id===mid})[0];
  lastFocus=origem||document.activeElement;
  var d=$("#drawer");
  d.innerHTML='<header><div><div class="tag">'+esc(b.nome)+'</div><h3 id="dTitle">'+esc(m.nome)+'</h3></div><button class="btn" id="dClose" type="button" aria-label="Fechar painel">'+ic("close")+'</button></header>'+
   '<div class="body"><h4>O que faz</h4><p>'+esc(m.faz)+'</p>'+
   '<h4>Arquivos reais no projeto</h4>'+lista(m.arquivos||[],true)+
   '<h4>Dados que entram e saem</h4><div class="io"><div><h5>Entram</h5>'+lista(m.entra||[])+'</div><div><h5>Saem</h5>'+lista(m.sai||[])+'</div></div>'+
   '<h4>Regras de negócio</h4>'+lista(m.regras||[])+
   (m.extra&&m.extra.length?'<h4>Detalhamento</h4><table class="kv">'+m.extra.map(function(x){return '<tr><td>'+esc(x.k)+'</td><td>'+esc(x.v)+'</td></tr>'}).join("")+'</table>':'')+'</div>';
  d.classList.add("on");d.setAttribute("aria-hidden","false");$("#veil").classList.add("on");
  $("#dClose").addEventListener("click",fecharDrawer);
  $("#dClose").focus();
}
function fecharDrawer(){
  var d=$("#drawer");if(!d.classList.contains("on"))return;
  d.classList.remove("on");d.setAttribute("aria-hidden","true");$("#veil").classList.remove("on");
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
}
$("#veil").addEventListener("click",fecharDrawer);

var simC=0, simS=0, simPlaying=false, simTimer=null, DELAY=4200;
function buildSim(){
  var p=$("#p1");
  p.innerHTML='<div class="eyebrow">Simulação</div><h1>Como os dados percorrem o sistema</h1>'+
   '<p class="lead">Escolha um cenário e acompanhe, passo a passo, quais blocos entram em ação e que endpoints ou arquivos reais estão envolvidos.</p>'+
   '<div class="seg" id="seg">'+CEN.map(function(c,i){return '<button class="btn" type="button" data-c="'+i+'" aria-pressed="false">'+esc(c.nome)+'</button>'}).join("")+'</div>'+
   '<div class="sim-grid"><div id="sdg">'+diagramHTML(false)+'</div>'+
   '<div class="legend" aria-live="polite"><div class="prog" id="prog"></div><div class="n" id="sn"></div><h3 id="st"></h3><p id="sd"></p><div class="chips" id="sc"></div><p class="nota" id="snota"></p>'+
   '<div class="ctrls"><button class="btn primary" id="bPlay" type="button"></button><button class="btn" id="bPrev" type="button">'+ic("prev")+'Anterior</button><button class="btn" id="bNext" type="button">Próximo'+ic("next")+'</button><button class="btn" id="bReset" type="button">'+ic("reset")+'Reiniciar</button></div></div></div>';
  $("#seg").addEventListener("click",function(e){var b=e.target.closest("[data-c]");if(b){simC=+b.dataset.c;simS=0;renderSim();simPlay()}});
  $("#bPlay").addEventListener("click",function(){if(simPlaying)simPause();else{if(simS>=CEN[simC].steps.length-1)simS=0;simPlay()}renderSim()});
  $("#bPrev").addEventListener("click",function(){simPause();simS=Math.max(0,simS-1);renderSim()});
  $("#bNext").addEventListener("click",function(){simPause();simS=Math.min(CEN[simC].steps.length-1,simS+1);renderSim()});
  $("#bReset").addEventListener("click",function(){simPause();simS=0;renderSim()});
  renderSim();
}
function simPlay(){
  simPause();simPlaying=true;
  simTimer=setInterval(function(){
    if(simS<CEN[simC].steps.length-1){simS++;renderSim()}else{simPause();renderSim()}
  },DELAY);
  renderSim();
}
function simPause(){simPlaying=false;if(simTimer){clearInterval(simTimer);simTimer=null}if($("#bPlay"))renderBtn()}
function renderBtn(){
  var last=simS>=CEN[simC].steps.length-1;
  $("#bPlay").innerHTML=simPlaying?ic("pause")+"Pausar":(last?ic("reset")+"Repetir":ic("play")+(simS===0?"Iniciar":"Continuar"));
}
function renderSim(){
  var c=CEN[simC],s=c.steps[simS];
  document.querySelectorAll("#seg [data-c]").forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.c===simC)});
  document.querySelectorAll("#sdg .node").forEach(function(n,i){var on=s.n.indexOf(i)>=0;n.classList.toggle("active",on);n.classList.toggle("idle",!on)});
  document.querySelectorAll("#sdg .edge").forEach(function(e,i){var on=s.e.indexOf(i)>=0;e.classList.toggle("on",on);e.classList.toggle("rev",on&&s.dir==="r")});
  $("#prog").innerHTML=c.steps.map(function(_,i){return '<i class="'+(i<simS?'done':i===simS?'cur':'')+'"></i>'}).join("");
  $("#sn").textContent="Passo "+(simS+1)+" de "+c.steps.length+" · "+c.nome;
  $("#st").textContent=s.t;$("#sd").textContent=s.d;
  $("#sc").innerHTML=s.c.map(function(x){return '<span class="chip mono">'+esc(x)+'</span>'}).join("");
  $("#snota").textContent=s.nota||"";
  $("#bPrev").disabled=simS===0;$("#bNext").disabled=simS>=c.steps.length-1;
  renderBtn();
}

/* ---------- apresentação ---------- */
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function renderPresBtn(){
  var on=document.body.classList.contains("pres");
  $("#btnPres").innerHTML=ic(on?"exit":"full")+(on?"Sair da apresentação":"Modo apresentação");
}
function setPres(on){
  document.body.classList.toggle("pres",on);
  renderPresBtn();
  var el=document.documentElement;
  try{
    if(on&&!isFull()){var r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){var pr=r.call(el);if(pr&&pr.catch)pr.catch(function(){})}}
    if(!on&&isFull()){var x=(document.exitFullscreen||document.webkitExitFullscreen);if(x){var p2=x.call(document);if(p2&&p2.catch)p2.catch(function(){})}}
  }catch(e){}
}
function onFs(){if(!isFull()&&document.body.classList.contains("pres")){document.body.classList.remove("pres");renderPresBtn()}}
document.addEventListener("fullscreenchange",onFs);
document.addEventListener("webkitfullscreenchange",onFs);
$("#btnPres").addEventListener("click",function(){setPres(!document.body.classList.contains("pres"))});

/* ---------- teclado ---------- */
document.addEventListener("keydown",function(e){
  var tag=(e.target&&e.target.tagName)||"";
  var typing=/INPUT|TEXTAREA|SELECT/.test(tag);
  if(e.key==="Escape"){
    if($("#drawer").classList.contains("on")){fecharDrawer();e.preventDefault()}
    return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="ArrowRight"){setTab(cur+1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){setTab(cur-1);e.preventDefault()}
  else if(e.key==="p"||e.key==="P"){setPres(!document.body.classList.contains("pres"))}
});
