services:
  postgres:
    image: postgres:16-alpine
    container_name: smartmarket-db-dev
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: smartmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env — veja .env.example}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
