name: SmartMarket CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Tests & Build (Java 17 / Spring Boot)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run Backend Compilation and Tests
        working-directory: ./backend
        run: ./mvnw clean test -B

  frontend-test:
    name: Frontend Tests & Production Build (React / Vite)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests (Jest)
        timeout-minutes: 15
        working-directory: ./frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  scraper-test:
    name: Scraper Tests (Python 3.11)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: pip install -r scraper/requirements-dev.txt

      # Os testes de PostgreSQL sao pulados automaticamente quando
      # SMARTMARKET_TEST_DSN nao esta definido (ver tests/test_pipeline_postgres.py).
      - name: Run Scraper Unit Tests
        run: python -m unittest discover -s scraper/tests -v
