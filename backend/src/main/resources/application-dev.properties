# ============================================
# SmartMarket - Perfil DESENVOLVIMENTO
# ============================================

# Banco de Dados PostgreSQL (via Docker)
spring.datasource.url=jdbc:postgresql://localhost:5436/smartmarket
spring.datasource.username=smartmarket
spring.datasource.password=smartmarket123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - cria/atualiza tabelas automaticamente no dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# data.sql so roda depois que o Hibernate garante as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Log de SQL
spring.jpa.show-sql=true

# Servidor
server.port=8080

# JWT — valor apenas de desenvolvimento local. NAO usar fora da sua maquina.
# Em producao o segredo vem de SMARTMARKET_JWT_SECRET (ver .env.example).
jwt.secret=${SMARTMARKET_JWT_SECRET:dev-only-secret-trocar-em-producao-32b}
