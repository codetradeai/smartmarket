<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Oficial: Verde Esmeralda para Azul Tecnológico -->
    <linearGradient id="sm-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="sm-text-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- ================= ÍCONE (CARRINHO + SINAL SMART) ================= -->
  <g id="smart-icon" transform="translate(10, 10)">
    <!-- Carrinho de Compras -->
    <path d="M 5 15 L 20 15 L 32 55 L 75 55 L 85 24 L 28 24" 
          stroke="url(#sm-gradient)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Base inferior do carrinho -->
    <path d="M 28 55 L 34 63 L 73 63" 
          stroke="url(#sm-gradient)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rodas -->
    <circle cx="42" cy="74" r="5.5" fill="url(#sm-gradient)" />
    <circle cx="68" cy="74" r="5.5" fill="url(#sm-gradient)" />

    <!-- Ponto central do sinal (Origem dos dados) -->
    <circle cx="53" cy="46" r="3.5" fill="url(#sm-gradient)" />

    <!-- Arco do Sinal 1 (Pequeno) -->
    <path d="M 44 38 A 12 12 0 0 1 62 38" 
          stroke="url(#sm-gradient)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Arco do Sinal 2 (Médio) -->
    <path d="M 37 30 A 21 21 0 0 1 69 30" 
          stroke="url(#sm-gradient)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Arco do Sinal 3 (Grande / Radar) -->
    <path d="M 30 22 A 30 30 0 0 1 76 22" 
          stroke="url(#sm-gradient)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
  </g>

  <!-- ================= TIPOGRAFIA PRINCIPAL ================= -->
  <g id="smart-text" transform="translate(115, 52)">
    <!-- Smart -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="42" 
          font-weight="800" 
          letter-spacing="-1px" 
          fill="#0F172A">Smart</text>
    
    <!-- Market -->
    <text x="122" y="0" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="42" 
          font-weight="800" 
          letter-spacing="-1px" 
          fill="url(#sm-text-green)">Market</text>

    <!-- Slogan / Subtítulo -->
    <text x="2" y="26" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="14.5" 
          font-weight="600" 
          letter-spacing="2.8px" 
          fill="#64748B">COMPARE • ESCOLHA • ECONOMIZE</text>
  </g>
</svg>
