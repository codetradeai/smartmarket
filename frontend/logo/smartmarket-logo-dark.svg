          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="42" cy="74" r="5.5" fill="url(#sm-gradient-dark)" />
    <circle cx="68" cy="74" r="5.5" fill="url(#sm-gradient-dark)" />

    <circle cx="53" cy="46" r="3.5" fill="url(#sm-gradient-dark)" />

    <path d="M 44 38 A 12 12 0 0 1 62 38" 
          stroke="url(#sm-gradient-dark)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <path d="M 37 30 A 21 21 0 0 1 69 30" 
