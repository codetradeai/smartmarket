# ============================================
# SmartMarket - Perfil PRODUCAO
# ============================================

# Banco de Dados PostgreSQL — todas as credenciais obrigatorias via ambiente.
# Para o Neon, SPRING_DATASOURCE_URL deve incluir ?sslmode=require na URL JDBC.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & DDL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
# NUNCA semear por padrao em producao: data.sql cria usuarios de exemplo,
# incluindo um ADMIN cuja senha esta em claro no proprio arquivo.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8

# Performance & Logging
spring.jpa.show-sql=false
# O Render define a variavel PORT; default 8080 para testes locais.
server.port=${PORT:8080}

# CORS em producao
cors.allowed-origins=${SMARTMARKET_CORS_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost:5173}
