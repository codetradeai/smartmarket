# ============================================
# SmartMarket - Configuracao Padrao
# ============================================
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT — em producao, definir via variavel de ambiente SMARTMARKET_JWT_SECRET
# JWT — obrigatorio via variavel de ambiente SMARTMARKET_JWT_SECRET.
# Sem default de proposito: um default commitado permite a qualquer pessoa
# com acesso ao repositorio forjar um token com papel ADMIN. O perfil dev
# define o seu valor; o perfil test tem o seu em application-test.properties.
jwt.secret=${SMARTMARKET_JWT_SECRET}
jwt.expiration=${SMARTMARKET_JWT_EXPIRATION:86400000}

# CORS — origens permitidas (separadas por virgula)
cors.allowed-origins=${SMARTMARKET_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

