<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Obsidian Dark Tech) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="45%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00E676" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Squircle (Padrão Apple iOS / Google Play) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Ícone Centralizado -->
  <g transform="translate(100, 110)" filter="url(#soft-glow)">
    <!-- Carrinho -->
    <path d="M 15 45 L 60 45 L 96 165 L 225 165 L 255 72 L 84 72" 
          stroke="url(#icon-grad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Base inferior -->
    <path d="M 84 165 L 102 189 L 219 189" 
          stroke="url(#icon-grad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Rodas -->
    <circle cx="126" cy="222" r="16" fill="url(#icon-grad)" />
    <circle cx="204" cy="222" r="16" fill="url(#icon-grad)" />

    <!-- Ponto central das ondas -->
    <circle cx="159" cy="138" r="10" fill="url(#icon-grad)" />

    <!-- Ondas de Sinal / Radar Smart -->
    <path d="M 132 114 A 36 36 0 0 1 186 114" 
          stroke="url(#icon-grad)" 
          stroke-width="13" 
          stroke-linecap="round" />

    <path d="M 111 90 A 63 63 0 0 1 207 90" 
          stroke="url(#icon-grad)" 
          stroke-width="13" 
          stroke-linecap="round" />

    <path d="M 90 66 A 90 90 0 0 1 228 66" 
          stroke="url(#icon-grad)" 
          stroke-width="13" 
          stroke-linecap="round" />
  </g>
</svg>
